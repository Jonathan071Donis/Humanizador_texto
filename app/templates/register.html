{% extends "base.html" %}
{% block content %}
<section class="container wm-auth-wrap">
  <div class="wm-auth-card">
    <div class="wm-eyebrow">empieza en segundos</div>
    <h2 class="mb-4">Crear cuenta</h2>
    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control wm-input" name="username" required minlength="3" maxlength="32">
      </div>
      <div class="mb-3">
        <label class="form-label">Contrase&ntilde;a</label>
        <input type="password" class="form-control wm-input" name="password" required minlength="6" maxlength="128">
        <div class="form-text wm-muted">M&iacute;nimo 6 caracteres.</div>
      </div>
      <div id="registerError" class="wm-alert-error d-none"></div>
      <button type="submit" class="btn wm-btn-accent w-100 mt-2">Crear cuenta</button>
    </form>
    <p class="text-center wm-muted mt-4">&iquest;Ya tienes cuenta? <a href="/login" class="wm-link">Inicia sesi&oacute;n</a></p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const errBox = document.getElementById('registerError');
  errBox.classList.add('d-none');
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: form.get('username'), password: form.get('password')})
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({detail: 'Error al crear la cuenta'}));
      errBox.textContent = data.detail || 'Error al crear la cuenta';
      errBox.classList.remove('d-none');
      return;
    }
    window.location.href = '/dashboard';
  } catch (err) {
    errBox.textContent = 'No se pudo conectar con el servidor.';
    errBox.classList.remove('d-none');
  }
});
</script>
{% endblock %}
