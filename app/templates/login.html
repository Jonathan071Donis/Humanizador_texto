{% extends "base.html" %}
{% block content %}
<section class="container wm-auth-wrap">
  <div class="wm-auth-card">
    <div class="wm-eyebrow">bienvenido de nuevo</div>
    <h2 class="mb-4">Iniciar sesi&oacute;n</h2>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control wm-input" name="username" required minlength="3">
      </div>
      <div class="mb-3">
        <label class="form-label">Contrase&ntilde;a</label>
        <input type="password" class="form-control wm-input" name="password" required minlength="6">
      </div>
      <div id="loginError" class="wm-alert-error d-none"></div>
      <button type="submit" class="btn wm-btn-accent w-100 mt-2">Entrar</button>
    </form>
    <p class="text-center wm-muted mt-4">&iquest;No tienes cuenta? <a href="/register" class="wm-link">Reg&iacute;strate</a></p>
    <p class="text-center wm-muted small">Las cuentas viven en memoria del servidor &mdash; se pierden al reiniciar (modo demo).</p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const errBox = document.getElementById('loginError');
  errBox.classList.add('d-none');
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: form.get('username'), password: form.get('password')})
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({detail: 'Error de inicio de sesi\u00f3n'}));
      errBox.textContent = data.detail || 'Credenciales inv\u00e1lidas';
      errBox.classList.remove('d-none');
      return;
    }
    window.location.href = '/dashboard';
  } catch (err) {
    errBox.textContent = 'No se pudo conectar con el servidor.';
    errBox.classList.remove('d-none');
  }
});
</script>
{% endblock %}
