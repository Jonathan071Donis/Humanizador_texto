<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg wm-nav sticky-top">
  <div class="container">
    <a class="navbar-brand wm-brand" href="/">
      <span class="wm-brand-mark">◈</span> {{ app_name }}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-grid-1x2 me-1"></i>Panel</a></li>
        <li class="nav-item"><a class="nav-link" href="/process"><i class="bi bi-search me-1"></i>Analizar</a></li>
        <li class="nav-item"><a class="nav-link" href="/code"><i class="bi bi-code-slash me-1"></i>C&oacute;digo</a></li>
        <li class="nav-item"><a class="btn wm-btn-accent btn-sm" href="/batch"><i class="bi bi-stack me-1"></i>Lote</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer class="wm-footer">
  <div class="container d-flex flex-wrap justify-content-between align-items-center py-4">
    <span class="wm-muted">{{ app_name }} &mdash; procesamiento en tiempo real, sin base de datos ni cuentas.</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
